<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizar | JJB Tech Consulting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light navbar-jjb py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <img src="img/Logotipo.png" alt="Logotipo JJB" width="100">
                    <h1 class="mb-0 fs-4 fw-bold text-dark">JJB Tech Consulting</h1>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="menuNavegacion">
                    <ul class="navbar-nav gap-3">
                        <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
                        <li class="nav-item"><a href="nosotros.html" class="nav-link">Expertiz</a></li>
                        <li class="nav-item"><a href="contacto.html" class="nav-link active">Cotizar</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5 mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center mb-4">
                <h2 class="fw-bold section-title">Cuéntanos sobre tu proyecto</h2>
                <p class="text-muted">Déjanos tus datos y diseñaremos una solución a tu medida.</p>
            </div>
            
            <div class="col-lg-6">
                <form id="formularioContacto" class="card card-jjb p-4 shadow-lg border-0 text-start">
                    <div class="mb-3">
                        <label for="nombre-cliente" class="form-label fw-bold"><i class="fas fa-building me-2" style="color: var(--jjb-accent);"></i>Empresa o Nombre:</label>
                        <input type="text" id="nombre-cliente" class="form-control" required placeholder="Ej: TechCorp S.A.">
                    </div>
                    
                    <div class="mb-3">
                        <label for="correo-negocio" class="form-label fw-bold"><i class="fas fa-envelope me-2" style="color: var(--jjb-accent);"></i>Correo Electrónico:</label>
                        <input type="email" id="correo-negocio" class="form-control" required placeholder="contacto@tuempresa.com">
                    </div>

                    <div class="mb-3">
                        <label for="pais-cliente" class="form-label fw-bold"><i class="fas fa-globe me-2" style="color: var(--jjb-accent);"></i>País:</label>
                        <select id="pais-cliente" class="form-select" required>
                            <option value="" disabled selected>Selecciona tu país...</option>
                            <option value="ec">Ecuador</option>
                            <option value="mx">México</option>
                            <option value="co">Colombia</option>
                            <option value="pe">Perú</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label for="detalles-proyecto" class="form-label fw-bold"><i class="fas fa-project-diagram me-2" style="color: var(--jjb-accent);"></i>Requerimientos Técnicos:</label>
                        <textarea id="detalles-proyecto" class="form-control" rows="4" required placeholder="Describe si necesitas desarrollo web, consultoría..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-jjb w-100"><i class="fas fa-paper-plane me-2"></i>Enviar Solicitud</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="pie-pagina text-center mt-auto">
        <div class="container">
            <p class="mb-1">&copy; 2026 JJB Tech Consulting | Equipo: José Escobar, Jonathan Ochoa, Bernabé Ruiz.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
